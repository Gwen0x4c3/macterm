name: Build Artifact

# Manual, secret-free build for machines without a local Xcode: a universal
# Release app, ad-hoc signed (no signing certificate is imported — build.sh's
# default when MACTERM_CODESIGN_IDENTITY is unset), packaged as the same DMG
# the release job ships, and uploaded as a run artifact to download from the
# Actions tab.
#
# NOT a distribution channel: the bundle is not notarized (first launch needs
# a right-click → Open, or `xattr -cr <dmg>`), carries the placeholder Sparkle
# key so auto-update is inert, and an ad-hoc signature makes every rebuild a
# new identity to TCC — privacy grants re-prompt per build. The real release
# path is release.yml. This exists so a contributor can dogfood a branch on a
# Mac that has no Xcode installed.

on:
  workflow_dispatch:

jobs:
  build:
    name: Build universal DMG (ad-hoc)
    runs-on: macos-26
    permissions:
      contents: read
    env:
      # setup.sh shells out to `gh` (GhosttyKit/zmx release downloads), and gh
      # inside Actions refuses to run without a token — same env release.yml
      # and test.yml carry. contents:read is enough: the downloads hit public
      # repos.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: jdx/mise-action@v4.3.0

      # Same pin as test.yml — the runner image's floating default Xcode is
      # how macterm#340 stayed invisible.
      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      # ISO week (YYYY-Www) — makes the GhosttyKit cache self-refresh weekly.
      - name: Cache epoch
        id: epoch
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      # Steps after this are shared verbatim with test.yml / release.yml
      # (identical cache key), so a run here can ride a cache those workflows
      # keep warm — and on a fork it warms its own. NO restore-keys fallback:
      # pairing a time-rolling key with a prefix restore-key re-baptizes stale
      # content under the fresh key forever (see test.yml).
      - name: Cache GhosttyKit
        uses: actions/cache@v6
        with:
          path: |
            GhosttyKit.xcframework
            Macterm/Resources/ghostty
            Macterm/Resources/terminfo
            Macterm/Resources/zmx
            .zmx-tag
            .ghosttykit-tag
          key: ghosttykit-${{ hashFiles('scripts/setup.sh') }}-${{ steps.epoch.outputs.week }}

      - name: Setup GhosttyKit
        run: mise run setup --verbose

      # The build script is invoked directly — NOT `mise run build`, whose
      # format/lint/test dependencies a dogfood build doesn't need (release.yml
      # does the same). VERSION defaults to 0.0.0, the Sparkle key falls back
      # to its placeholder (auto-update off), and the signature is ad-hoc.
      - name: Build universal DMG
        run: ./scripts/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dmg
          path: build/*.dmg
          retention-days: 14
